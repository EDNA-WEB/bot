name: Denny skraper

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  run-scraper:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install requests beautifulsoup4
      - run: python scraper.py
      - name: Ulozit zmeny
        run: |
          git config --global user.name "Bot"
          git config --global user.email "bot@users.noreply.github.com"
          git add data.json
          git diff --quiet && git diff --cached --quiet || (git commit -m "Automaticka aktualizacia" && git push)
